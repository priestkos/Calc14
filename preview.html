<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CalculatorXIV preview</title>
<style>
  /* Palette matched to CalculatorWindow.cs Vector4 theme (warm ember). */
  :root {
    --bg: #1c1c1e;
    --calc-bg: rgba(23, 13, 10, 0.97); /* former BgDark */
    --panel: rgba(36, 20, 15, 0.95);    /* Panel 0.14,0.08,0.06 */
    --key: #33211a;                    /* KeyPad 0.20,0.13,0.10 */
    --orange: #f2731a;                 /* AccentOrange 0.95,0.45,0.10 */
    --red: #b8291f;                    /* AccentRed 0.72,0.16,0.12 */
    --text: #ffebd9;                   /* TextWarm 1,0.92,0.85 */
    --dim: #bf9e85;                    /* TextDim 0.75,0.62,0.52 */
    --title: #ffb591;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body.shot {
    display: inline-block;
    padding: 20px;
    background: #121214;
  }
  body.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 24px;
    align-items: flex-start;
    min-height: 100vh;
  }
  body.overlay {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(40, 70, 90, 0.45), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(90, 50, 30, 0.35), transparent 45%),
      linear-gradient(160deg, #1a2430 0%, #0e141c 45%, #1c1814 100%);
    width: 960px;
    height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body.overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.35) 0%, transparent 30%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
    pointer-events: none;
  }
  .hud {
    position: absolute;
    left: 28px;
    bottom: 28px;
    color: rgba(220, 235, 255, 0.55);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 0;
  }
  .hud strong {
    display: block;
    color: rgba(255, 210, 160, 0.7);
    font-size: 13px;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    text-transform: none;
  }
  .calc {
    width: 320px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--calc-bg);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    padding: 10px; /* ImGui WindowPadding */
    position: relative;
    z-index: 1;
  }
  body.overlay .calc {
    box-shadow: 0 16px 50px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,180,120,0.08);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px 8px;
  }
  .titlebar .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--orange);
  }
  .titlebar span { color: var(--title); font-size: 13px; }
  .display {
    background: var(--panel);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    min-height: 74px; /* ImGui display child */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sub { color: var(--dim); font-size: 12px; text-align: left; min-height: 16px; }
  .result {
    color: var(--text);
    font-size: 34px;
    text-align: right;
    font-weight: 300;
    letter-spacing: 0.5px;
    line-height: 1.1;
  }
  .result.small { font-size: 22px; }
  .result.error { color: #ffb4a8; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button {
    height: 60px; /* ImGui button size */
    border: none;
    border-radius: 8px; /* FrameRounding */
    cursor: pointer;
    font-size: 19px;
    color: var(--text);
    background: var(--key);
  }
  .op { background: var(--orange); }
  .clear { background: var(--red); }
  .pressed {
    filter: brightness(1.35);
    outline: 2px solid rgba(255,235,217,0.35);
    outline-offset: -2px;
  }
  .hist { margin-top: 10px; }
  .hist label {
    color: var(--text);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .histbox {
    background: var(--panel);
    border-radius: 4px;
    margin-top: 6px;
    height: 130px; /* ImGui history child */
    overflow: hidden;
    padding: 6px 8px;
    font-size: 12px;
  }
  .histbox .empty { color: var(--dim); padding: 4px; }
  .histbox .row {
    color: var(--text);
    padding: 4px;
  }
  .histbox .row + .row {
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .histbox .row:first-child {
    background: rgba(242, 115, 26, 0.18);
    border-radius: 3px;
  }
  .clear-hist {
    margin-top: 6px;
    width: 100%;
    height: 28px;
    font-size: 12px;
    border-radius: 6px;
    background: var(--key);
    color: var(--text);
    border: none;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card .caption {
    color: #888;
    font-size: 12px;
    max-width: 320px;
  }
  .note { color: #888; font-size: 12px; max-width: 260px; align-self: center; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "gallery";

  // States reflect post-#1 CalculatorWindow behavior (theme for full frame,
  // CE keeps pending subDisplay, divide-by-zero → Error, Clear History).
  const states = {
    result: {
      sub: "\u00a0",
      result: "46",
      history: true,
      lines: ["12 + 34 = 46", "200 + 10% = 220", "9 ÷ 2 = 4.5", "6 × 7 = 42"],
      press: null,
    },
    mid: {
      // After entering 128 ÷ 16 (pending next key / equals)
      sub: "128 ÷",
      result: "16",
      history: true,
      lines: ["6 × 7 = 42", "9 ÷ 2 = 4.5", "200 + 10% = 220"],
      press: null,
    },
    compact: {
      sub: "\u00a0",
      result: "0",
      history: false,
      lines: [],
      press: null,
    },
    equals: {
      sub: "\u00a0",
      result: "1337",
      history: true,
      lines: ["1000 + 337 = 1337", "50 × 2 = 100", "9 ÷ 3 = 3"],
      press: "=",
    },
    error: {
      // Divide-by-zero resets to Error (CalculatorState / ApplyOp path)
      sub: "\u00a0",
      result: "Error",
      history: true,
      lines: ["6 × 7 = 42"],
      press: "=",
      isError: true,
    },
  };

  function renderCalc(state, extraClass = "") {
    let hist;
    if (state.history) {
      const body = state.lines.length
        ? state.lines.map((l) => `<div class="row">${l}</div>`).join("")
        : `<div class="empty">No calculations yet.</div>`;
      hist = `<div class="hist">
          <label><input type="checkbox" checked disabled> History</label>
          <div class="histbox">${body}</div>
          <button class="clear-hist" type="button">Clear History</button>
        </div>`;
    } else {
      hist = `<div class="hist"><label><input type="checkbox" disabled> History</label></div>`;
    }

    const keys = [
      ["AC", "clear"], ["CE", "clear"], ["⌫", ""], ["÷", "op"],
      ["7", ""], ["8", ""], ["9", ""], ["×", "op"],
      ["4", ""], ["5", ""], ["6", ""], ["−", "op"],
      ["1", ""], ["2", ""], ["3", ""], ["+", "op"],
      ["%", ""], ["0", ""], [".", ""], ["=", "op"],
    ];
    const grid = keys
      .map(([label, cls]) => {
        const pressed = state.press === label ? " pressed" : "";
        return `<button class="${cls}${pressed}" type="button">${label}</button>`;
      })
      .join("");

    const resultClass = [
      "result",
      state.result.length > 9 ? "small" : "",
      state.isError ? "error" : "",
    ].filter(Boolean).join(" ");

    // ImGui window title is the text before "##" in "Calculator##CalculatorXIV"
    return `<div class="calc ${extraClass}">
      <div class="titlebar"><div class="dot"></div><span>Calculator</span></div>
      <div class="display">
        <div class="sub">${state.sub}</div>
        <div class="${resultClass}">${state.result}</div>
      </div>
      <div class="grid">${grid}</div>
      ${hist}
    </div>`;
  }

  if (mode === "gallery") {
    document.body.className = "gallery";
    document.body.innerHTML = `
      <div class="card">${renderCalc(states.result)}<div class="caption">Result with history + Clear History</div></div>
      <div class="card">${renderCalc(states.mid)}<div class="caption">Mid-operation (pending ÷)</div></div>
      <div class="card">${renderCalc(states.compact)}<div class="caption">Compact — history hidden</div></div>
      <div class="card">${renderCalc(states.error)}<div class="caption">Divide-by-zero Error</div></div>
      <p class="note">HTML replica of the ImGui window after the review-findings build — same palette, sizing, Clear History, and Error path as CalculatorWindow.cs.</p>
    `;
  } else if (mode === "overlay") {
    document.body.className = "overlay";
    document.body.innerHTML = `
      <div class="hud"><strong>Limsa Lominsa Lower Decks</strong>Party · Duty Finder · Chat</div>
      ${renderCalc(states.equals)}
    `;
  } else {
    document.body.className = "shot";
    const state = states[mode] || states.result;
    document.body.innerHTML = renderCalc(state);
  }
</script>
</body>
</html>
