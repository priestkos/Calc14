<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calc14 mock — history</title>
  <link rel="stylesheet" href="imgui-calc14.css" />
</head>
<body>
  <div class="scene">
    <div class="hud-label">Mock game view · Example Character</div>
    <div class="imgui-window calc-window" style="top: 60px; left: 460px;">
      <div class="imgui-titlebar">
        <span>Calculator</span>
        <span class="close"></span>
      </div>
      <div class="imgui-body">
        <div class="display-panel">
          <div class="sub-display"></div>
          <div class="main-display size-lg">220</div>
        </div>
        <div class="key-grid">
          <button class="key key-red" type="button">AC</button>
          <button class="key key-red" type="button">CE</button>
          <button class="key key-pad" type="button">⌫</button>
          <button class="key key-orange" type="button">÷</button>
          <button class="key key-pad" type="button">7</button>
          <button class="key key-pad" type="button">8</button>
          <button class="key key-pad" type="button">9</button>
          <button class="key key-orange" type="button">×</button>
          <button class="key key-pad" type="button">4</button>
          <button class="key key-pad" type="button">5</button>
          <button class="key key-pad" type="button">6</button>
          <button class="key key-orange" type="button">−</button>
          <button class="key key-pad" type="button">1</button>
          <button class="key key-pad" type="button">2</button>
          <button class="key key-pad" type="button">3</button>
          <button class="key key-orange" type="button">+</button>
          <button class="key key-pad" type="button">%</button>
          <button class="key key-pad" type="button">0</button>
          <button class="key key-pad" type="button">.</button>
          <button class="key key-orange" type="button">=</button>
        </div>
        <div class="history-row">
          <input type="checkbox" checked disabled /> History
        </div>
        <div class="history-panel">
          <ul class="history-list">
            <li>200 + 10% = 220</li>
            <li class="selected">150 × 1.5 = 225</li>
            <li>1000 − 780 = 220</li>
            <li>1+2*3 = 7</li>
          </ul>
        </div>
        <button class="btn-clear" type="button">Clear History</button>
      </div>
    </div>
    <p class="callout" style="top: 520px; left: 460px;">Click a history line to load its result into the entry display.</p>
  </div>
</body>
</html>
